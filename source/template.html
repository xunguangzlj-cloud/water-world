<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>
<title>水世界 · 深海花园</title>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content=#03131c>
<style>
/* The class on <body> is the state of the page:
   l = loading, m = menu, g = in the scene (g p while the mouse is captured), l e = failed to start */
html { background: #03131c; }
body {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(#0b3a4d, #03131c 70%);
  font: 700 clamp(13px, .7vw + .9vh, 36px)/1.4 system-ui, sans-serif; color: #e8fbff;
  -webkit-user-select: none; user-select: none;
}
body { height:100dvh; }

/* the scene: blurred and dimmed behind the menu, comes into focus when you dive */
canvas {
  position: absolute; width: 100%; height: 100%; touch-action: none; cursor: grab;
  transition: filter 1s, transform 1s, opacity 2s;
}
body:not(.g) canvas { filter: blur(1vmax) brightness(.5); transform: scale(1.06); }
.l canvas { opacity: 0; }
canvas:active { cursor: grabbing; }

/* menu: the loading bar and the buttons share one grid cell, so nothing jumps when they swap */
#m {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: min(2.2em, 6vmin);
  padding: 1em 1em 4.5em; text-align: center; background: radial-gradient(#03131c00 30%, #03131ccc);
  transition: opacity .5s, visibility .5s;
}
.g #m, .m #l, .l #g { opacity: 0; visibility: hidden; }
.g #m { pointer-events:none; }
h1 {
  margin: 0; font: 900 4.4em/1 system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase;
  color: #0000; background: linear-gradient(#fff 25%, #7ff3ff 60%, #14a9c4);
  -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 .06em .2em #000c);
}
p { margin: 0; }
#a { display: grid; width: 27em; max-width: 100%; }
#a > * { grid-area: 1/1; transition: opacity .8s, visibility .8s; }
#s, #w, #q, #k, #h { font-size: .8em; letter-spacing: .12em; text-transform: uppercase; }
#w { margin-top: 1.2em; color: #7ff3ff; text-wrap: balance; }

/* loading bar */
#p {
  height: .5em; margin: .4em 0 1em; overflow: hidden; border-radius: 1em; background: #03131c;
  box-shadow: 0 0 0 2px #7ff3ff80, 0 0 1.5em #14a9c4;
}
#b {
  display: block; height: 100%; background: linear-gradient(90deg, #14a9c4, #9ff6ff);
  transform: scaleX(0); transform-origin: 0; will-change: transform;
}
.e #p { visibility: hidden; }
.e #s { font-size: 1.1em; letter-spacing: 0; text-transform: none; }

/* buttons */
button, a {
  display: flex; align-items: center; justify-content: center; gap: .6em; padding: .8em 1.4em; border: 0;
  border-radius: .5em; background: #fff; box-shadow: inset 0 -.2em #0003, 0 .3em 1em #0009;
  font: 800 1em/1.2 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-decoration: none;
  color: #03222d; cursor: pointer; transition: transform .12s, filter .12s;
}
button:hover, a:hover { transform: translateY(-.12em); filter: brightness(1.15); }
button:active, a:active { transform: translateY(.1em); filter: brightness(.9); }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#g { display: grid; gap: min(1.2em, 3.5vmin); }
#d {
  padding: .9em; background: linear-gradient(#9ff6ff, #19c3d6); font-size: 1.3em;
  box-shadow: inset 0 -.2em #0003, 0 0 2em #19c3d6b3;
}

/* 菜单底部的仓库入口 */
#f { position: absolute; left: 0; right: 0; bottom: 1.5em; display: flex; justify-content: center; gap: 1em; font-size: .8em; }
svg { width: 1.5em; height: 1.5em; fill: currentColor; }

/* dark plates under the dive button: detail level, list of controls, touch hint */
#q, #k, #h { padding: 1em 1.6em; border-radius: .7em; background: #03131cb3; }

/* detail level: three buttons in a row, the current one lit */
#q { display: flex; align-items: center; gap: .4em; padding: .4em; }
#q span { flex: 1; color: #7ff3ff; }
#q button { flex: 1.2; padding: .7em 0; background: none; box-shadow: none; color: #e8fbff; }
#q button:hover { background: #7ff3ff33; }
#q .on { background: linear-gradient(#9ff6ff, #19c3d6); box-shadow: inset 0 -.2em #0003; color: #03222d; pointer-events: none; }

/* list of controls: two groups, key caps right-aligned against their labels */
#k { display: flex; justify-content: center; gap: 2em; text-align: left; }
#k p { display: grid; grid-template-columns: auto auto; align-content: start; align-items: center; gap: .55em .9em; }
#k p + p { padding-left: 2em; border-left: 2px solid #7ff3ff40; }
#k i { display: flex; justify-self: end; align-items: center; gap: .25em; font-style: normal; }
#k b {
  min-width: 1.1em; padding: .2em .5em; border-radius: .35em; background: #e8fbff;
  box-shadow: inset 0 -.15em #0004; color: #03222d; text-align: center;
}
#h { display: none; }
@media (max-height: 30em) {
  #k { display: none; }
}
.handheld #h { display:block; }
.handheld #k { display:none; }

/* in the scene: a small menu button (hidden while the mouse is captured, Esc does the same) and the stats line */
#o {
  position: absolute; top: .6em; right: .6em; display: none; padding: .3em .6em; background: #03222dd9;
  box-shadow: inset 0 0 0 2px #7ff3ff, 0 .3em 1em #0009; font-size: 1.3em; color: #e8fbff; opacity: .8;
}
.g #o { display: flex; }
.p #o { display: none; }
#i {
  position: absolute; top: 1em; left: 1.2em; margin: 0; font: .8em/1.6 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; text-shadow: 0 1px 4px #000; pointer-events: none;
}
#k { gap:1em; white-space:nowrap } #k p + p { padding-left:1em }
#sites { width:100%; padding:.7em 1em; border:1px solid #7ff3ff55; border-radius:.5em; color:#e8fbff; background:#062a38; font:inherit; cursor:pointer; }
#field { display:none; position:absolute; left:max(1em,env(safe-area-inset-left)); bottom:max(1em,env(safe-area-inset-bottom)); width:min(22em,75%); }
.g #field { display:block; }
#observe { display:inline-flex; padding:.65em .9em; background:#072532dc; color:#dbf9f7; font-size:.82em; box-shadow:none; border:1px solid #7ff3ff66; }
#observe[hidden] { display:none; }
#action { display:inline-flex; vertical-align:middle; min-height:42px; margin:.25em 0; padding:.65em .9em; font-size:.85em; letter-spacing:.035em; color:#ddfff4; background:#103b39e0; border:1px solid #94dbc6ae; box-shadow:none; pointer-events:auto; }
#action[hidden] { display:none; }
#perspective { display:none; position:absolute; top:max(9px,env(safe-area-inset-top)); right:max(62px,calc(env(safe-area-inset-right) + 62px)); min-height:36px; padding:.45em .8em; border:1px solid #99cdc4a3; background:#072532ce; box-shadow:none; color:#e4fcf8; font-size:13px; letter-spacing:.04em; }
.g #perspective {display:block}
.handheld #perspective {min-height:44px;}
.handheld #field {max-width:calc(100% - 194px);}
#action:disabled { color:#d1e5e1; background:#102b35dd; border-color:#73978c; cursor:default; }
html:not(.handheld) #action:enabled::before { content:'R'; border:1px solid #a7c9bc91; padding:.1em .35em; border-radius:.25em; font-size:.85em; }
#note { margin-bottom:.55em; padding:.8em 1em; background:#04202de8; border-left:2px solid #77ded4; font-weight:500; line-height:1.65; }
@media (max-height: 580px), (pointer:coarse) { #m { gap:.65em; padding-bottom:3em } #g {gap:.5em} #f {bottom:.65em} h1 { font-size:3.2em } }
#mode { display:flex; justify-content:center; align-items:center; gap:.55em; min-height:32px; cursor:pointer; }
#mode input { width:1.2em; height:1.2em; accent-color:#76dce2; }
#handset { display:none; }
.handheld .g #handset { display:block; pointer-events:none; }
#stick, #depth button { touch-action:none; -webkit-touch-callout:none; pointer-events:auto; user-select:none; }
#stick { --size:clamp(96px,24vmin,130px); position:absolute; width:var(--size); height:var(--size); bottom:max(16px,env(safe-area-inset-bottom)); left:max(16px,env(safe-area-inset-left)); border-radius:50%; border:1px solid #c3f4ec91; background:radial-gradient(circle,#072e4055 46%,#acdfe529 48%,#09314473 52%); box-shadow:inset 0 0 0 5px #cee9e813; }
#stick i { position:absolute; height:34%; width:34%; top:33%; left:33%; border-radius:50%; background:#d6fcf0b3; box-shadow:0 2px 9px #06262a88; pointer-events:none; }
#stick::before, #stick::after { content:""; position:absolute; inset:4px 49%; border-block:5px solid #d2f7ed9c; }
#stick::after { transform:rotate(90deg); }
#depth { position:absolute; right:max(16px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); display:grid; gap:6px; }
#depth button { height:44px; min-width:64px; padding:0 .65em; border:1px solid #bbede284; border-radius:14px; background:#09334099; color:#edfff8; font:600 14px system-ui,sans-serif; letter-spacing:.05em; box-shadow:none; }
#depth button.held { color:#093340; background:#c7eee5dd; }
.handheld #o { min-height:44px; min-width:44px; top:max(8px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right)); }
.handheld #field { top:max(10px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); bottom:auto; width:min(21em,70%); display:none; flex-direction:column-reverse; align-items:start; pointer-events:none; gap:.3em; }
.handheld .g #field { display:flex; }
.handheld #observe { pointer-events:auto; min-height:40px; }
.handheld #m { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto; box-sizing:border-box; padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); gap:min(3vh,18px); }
.handheld #m h1 { margin-top:auto; }
.handheld #a { flex:none; }
.handheld #f { position:static; margin-bottom:auto; }
.handheld #g { gap:6px; }
.handheld #h { padding:.55em 1em; line-height:1.6; text-transform:none; }
@media (orientation:landscape) and (max-height:480px) {
  .handheld #m { gap:6px; }
  .handheld #m h1 { font-size:2.2em; }
  .handheld #d { padding:.55em; }
}
</style>
</head>
<body class=l>
<canvas id=c aria-label="可自由游动的三维海底世界"></canvas>
<div id=m>
  <h1>深海花园</h1>
  <div id=a>
    <div id=l><div id=p><i id=b></i></div><p id=s>准备下潜…</p><p id=w hidden>推荐使用支持 WebGPU 的 Chrome 或 Edge 浏览器</p></div>
    <div id=g>
      <button id=d>开始潜水</button>
      <select id=sites aria-label="前往潜点">
        <option value="">前往潜点…</option>
        <optgroup label="西侧新海域"><option value="7">7　潮汐星盘 · 转动铜环</option><option value="8">8　水母洄游湾 · 拨动水流</option><option value="9">9　热液烟囱群</option></optgroup>
        <optgroup label="原有海域"><option value="1">1　鲸尾石雕 · 投喂礁鱼</option><option value="2">2　沉船峡谷 · 敲钟</option><option value="3">3　通天石柱</option><option value="4">4　海绵花园</option><option value="5">5　海藻盆地</option><option value="6">6　紫色岩窟</option></optgroup>
      </select>
      <p id=q><span>画质</span><button>低</button><button>中</button><button>高</button></p>
      <label id=mode><input type=checkbox id=handMode>手机操控</label>
      <div id=k>
        <p>
          <i><b>W</b><b>A</b><b>S</b><b>D</b></i>游动
          <i><b>Q</b><b>E</b></i>下潜 / 上浮
          <i><b>Shift</b></i>加速
          <i><b>1</b>–<b>9</b></i>切换潜点
        </p>
        <p>
          <i><b>左键拖动</b></i>转动视角
          <i><b>Esc</b></i>菜单
          <i><b>M</b></i>开关声音
          <i><b>H</b></i>性能数据
          <i><b>V</b></i>切换人称
        </p>
      </div>
      <p id=h>左手推摇杆游动，推到外圈加速。右手滑动画面转头，按住上浮或下潜调整深度。</p>
    </div>
  </div>
  <p id=f>
    <a href=https://github.com/xunguangzlj-cloud/water-world target=_blank rel=noopener><svg viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>GitHub</a>
  </p>
</div>
<button id=o aria-label=打开菜单>≡</button>
<button id=perspective type=button title="切换第一、第三人称（V）">切换人称</button>
<div id=handset><div id=stick role=group aria-label="游动摇杆"><i></i></div><div id=depth><button id=rise>上浮</button><button id=sink>下潜</button></div></div>
<pre id=i></pre>
<aside id=field><p id=note hidden></p><button id=observe hidden aria-controls=note aria-expanded=false title="查看或收起观察笔记（F）">观察</button> <button id=action hidden aria-live=polite></button></aside>
<script id=actor-data type=application/octet-stream>AVATAR_PAYLOAD</script>
<script>

</script>
</body>
</html>
